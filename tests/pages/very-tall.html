<!doctype html><html><head><meta charset="utf-8"><title>Very tall page</title>
<style>body{margin:0} div{height:1000px;font:40px sans-serif;color:#fff;padding:20px;box-sizing:border-box}</style></head>
<body><script>for (let i = 0; i < 40; i++) document.write(`<div style="background:hsl(${i * 37 % 360},70%,45%)">Band ${i + 1} of 40</div>`);</script></body></html>
